[General]
network = BlockchainNet
sim-time-limit = 30s
seed-set = 1
*.numReplicas = 4     # N = 3f+1 -> f = 1, quorum = 3
*.numRsu = 2
*.numVehicles = 12
*.v2iDelay = 1.24ms
*.backhaulDelay = 10ms
*.cloudDelay = 5ms
*.verifyTime = 0.97ms
*.signTime = 2.89ms
*.blockInterval = 1s
*.maxTxPerBlock = 1000
*.blockHeaderSize = 80
*.eventRecordSize = 74
*.trustRecordSize = 2009
*.trustUpdateInterval = 600s
*.commitTime = 10ms
*.vehicle[*].txInterval = 0.1s   # mean inter-arrival per vehicle (exponential)
*.vehicle[*].txCategory = -1      # -1 = uniform over the 4 business categories
cmdenv-express-mode = true
cmdenv-autoflush = true

[Config N20]
extends = General
*.numReplicas = 20
*.numRsu = 10
