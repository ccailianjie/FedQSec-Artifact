[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedqsec-artifact"
version = "0.1.0"
description = "Lightweight executable artifact for the FedQSec framework"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["fl*", "aggregators*", "attackers*", "blockchain*", "crypto*", "datapreprocessor*"]
