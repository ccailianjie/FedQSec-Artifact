[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
**.cmdenv-log-level = info
network = RSUExampleScenario
image-path = ../../images
debug-on-errors = false
print-undisposed = true
sim-time-limit = 600s
**.scalar-recording = true
**.vector-recording = true
*.playgroundSizeX = 4765m
*.playgroundSizeY = 4342m
*.playgroundSizeZ = 50m
*.annotations.draw = false
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("nyc_2km_100.launchd.xml")
*.rsu[0].mobility.x = 1949
*.rsu[0].mobility.y = 2339
*.rsu[0].mobility.z = 3
*.rsu[1].mobility.x = 1326
*.rsu[1].mobility.y = 1757
*.rsu[1].mobility.z = 3
*.rsu[0].display-string = "p=2930,2199;i=veins/sign/yellowdiamond;is=s"
*.rsu[1].display-string = "p=1316,2721;i=veins/sign/yellowdiamond;is=s"
*.rsu[2].display-string = "p=2246,1400;i=veins/sign/yellowdiamond;is=s"
*.rsu[3].display-string = "p=1260,1693;i=veins/sign/yellowdiamond;is=s"
*.rsu[4].display-string = "p=2416,3182;i=veins/sign/yellowdiamond;is=s"
