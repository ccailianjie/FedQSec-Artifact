*.rsu[3].mobility.y = 2019
*.rsu[3].mobility.z = 3
*.rsu[4].mobility.x = 2950
*.rsu[4].mobility.y = 2514
*.rsu[4].mobility.z = 3
*.rsu[*].applType = "TraCIDemoRSU11p"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.beaconInterval = 1s
*.rsu[*].nic.mac1609_4.useServiceChannel = false
*.rsu[*].nic.mac1609_4.txPower = 20mW
*.rsu[*].nic.mac1609_4.bitrate = 6Mbps
*.rsu[*].nic.mac1609_4.headerLength = 0 bit
*.rsu[*].nic.phy80211p.usePropagationDelay = true
*.rsu[*].nic.phy80211p.useNoiseFloor = true
*.rsu[*].nic.phy80211p.noiseFloor = -98dBm
*.rsu[*].nic.phy80211p.minPowerLevel = -98dBm
*.rsu[*].nic.phy80211p.decider = xmldoc("config.xml")
*.rsu[*].nic.phy80211p.analogueModels = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']")
*.rsu[*].nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 6000m
*.node[*].nic.mac1609_4.useServiceChannel = false
*.node[*].nic.mac1609_4.txPower = 20mW
*.node[*].nic.mac1609_4.bitrate = 6Mbps
*.node[*].nic.mac1609_4.headerLength = 0 bit
*.node[*].nic.phy80211p.usePropagationDelay = true
*.node[*].nic.phy80211p.useNoiseFloor = true
*.node[*].nic.phy80211p.noiseFloor = -98dBm
*.node[*].nic.phy80211p.minPowerLevel = -98dBm
*.node[*].nic.phy80211p.decider = xmldoc("config.xml")
*.node[*].nic.phy80211p.analogueModels = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']")
*.node[*].nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m
*.node[*].applType = "TraCIDemo11p"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 1s
*.node[*].appl.scenarioIndex = -1
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.buildingsVisualizer.polyFile = "nyc_buildings_sumo.poly.xml"
*.buildingsVisualizer.fillColor = "sandybrown"
*.buildingsVisualizer.fillOpacity = 0.15

[Config Default]
*.obstacles.obstacles = xmldoc("nyc_obstacles.xml")

